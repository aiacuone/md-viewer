name: Deploy to Oracle VM

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${HOME}/md-viewer"
            if [[ ! -d "${APP_DIR}/.git" ]]; then
              echo "ERROR: ${APP_DIR} missing. Run scripts/install-on-vm.sh on the VM first."
              exit 1
            fi
            # Ensure deploy script exists (first auto-deploy after adding this workflow)
            if [[ ! -f "${APP_DIR}/scripts/deploy-on-vm.sh" ]]; then
              cd "${APP_DIR}"
              git fetch origin
              git reset --hard origin/master
            fi
            bash "${APP_DIR}/scripts/deploy-on-vm.sh"
