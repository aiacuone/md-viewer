# Public front for MD Viewer.
# Preview and built assets are files on disk. Node only receives sign-in and signed-in traffic.
# Hostname: md-viewer-aiacuone.duckdns.org. Confirm the app directory before installing.

limit_req_zone $binary_remote_addr zone=md_preview:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=md_app:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=md_conn:1m;

map $cookie_md_session $md_signed_in {
	default 1;
	"" 0;
}

server {
	listen 80;
	server_name md-viewer-aiacuone.duckdns.org;
	client_max_body_size 2m;

	location /_app/ {
		alias /home/ubuntu/md-viewer/build/client/_app/;
		limit_req zone=md_preview burst=40 nodelay;
		limit_conn md_conn 20;
	}

	location ~ ^/(favicon\.svg|manifest\.webmanifest|pwa-.*\.png|sw\.js|workbox-.*\.js)$ {
		root /home/ubuntu/md-viewer/build/client;
		limit_req zone=md_preview burst=20 nodelay;
		limit_conn md_conn 10;
	}

	location /preview {
		root /home/ubuntu/md-viewer/build/prerendered;
		limit_req zone=md_preview burst=20 nodelay;
		limit_conn md_conn 10;
		try_files $uri.html $uri =404;
	}

	location = /welcome {
		if ($md_signed_in = 1) {
			return 302 /;
		}
		limit_req zone=md_app burst=8 nodelay;
		limit_conn md_conn 10;
		proxy_pass http://127.0.0.1:3000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
	}

	location /login {
		limit_req zone=md_app burst=8 nodelay;
		limit_conn md_conn 10;
		proxy_pass http://127.0.0.1:3000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
	}

	location /auth/ {
		limit_req zone=md_app burst=8 nodelay;
		limit_conn md_conn 10;
		proxy_pass http://127.0.0.1:3000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
	}

	location = /logout {
		limit_req zone=md_app burst=8 nodelay;
		proxy_pass http://127.0.0.1:3000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
	}

	location /api/ {
		if ($md_signed_in = 0) {
			return 401;
		}
		limit_req zone=md_app burst=20 nodelay;
		limit_conn md_conn 10;
		proxy_pass http://127.0.0.1:3000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
	}

	location / {
		if ($md_signed_in = 0) {
			return 302 /welcome;
		}
		limit_req zone=md_app burst=20 nodelay;
		limit_conn md_conn 10;
		proxy_pass http://127.0.0.1:3000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
	}
}
